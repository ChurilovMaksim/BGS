name: Weighted Pell echo verification and publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pell-echo-verification.yml'
      - 'computations/maintenance/integrate_pell_echo.py'
      - 'computations/verification/pell_weighted_echo_regression.py'
      - 'formalization/Bgs/PellEchoWeights.lean'
      - 'mathematics/pell_weighted_gaussian_echo.md'
      - 'manuscript/pell_weighted_echo_section.tex'
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish verified source integration and derived files
permissions:
  contents: write
  actions: write
concurrency:
  group: pell-research-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt matplotlib==3.10.5
      - name: Integrate source, register Lean, and check idempotence
        run: |
          python computations/maintenance/publish_pell_research.py
          python computations/maintenance/integrate_pell_echo.py
          before="$(git diff | sha256sum)"
          python computations/maintenance/publish_pell_research.py
          python computations/maintenance/integrate_pell_echo.py
          after="$(git diff | sha256sum)"
          test "$before" = "$after"
          python -W error::SyntaxWarning -m compileall -q computations
      - name: Build all maintained C++ targets
        run: |
          cmake -S . -B "$RUNNER_TEMP/wow-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/wow-build" -j2
      - name: Generate exact and numerical research evidence
        run: |
          python computations/verification/pell_gaussian_regression.py --output evidence/numerical/pell_gaussian_blocks.json --figure assets/figures/pell_fourth_moment.png
          python computations/verification/pell_floquet_regression.py --cpp "$RUNNER_TEMP/wow-build/pell_floquet_pair_verifier" --extended --probes 32 --output evidence/certificates/pell_floquet_audit.json
          python computations/verification/spectral_lattice_clustering.py --cpp "$RUNNER_TEMP/wow-build/spectral_lattice_clustering" --output evidence/certificates/spectral_lattice_clustering.json
          python computations/verification/pell_weighted_echo_regression.py --output evidence/certificates/pell_weighted_echo_audit.json
          python computations/analysis/spectral_diagnostics.py spacing > evidence/numerical/goe_spacing.json
          python computations/verification/repository_audit.py
      - name: Execute the full maintained verification suite
        run: |
          mkdir -p "$RUNNER_TEMP/echo-deliverables/checks"
          python - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          import hashlib, json, os, platform, subprocess, sys
          import numpy, sympy
          root=Path.cwd(); out=Path(os.environ['RUNNER_TEMP'])/'echo-deliverables/checks'
          build=Path(os.environ['RUNNER_TEMP'])/'wow-build'
          todo=[]
          for p in sorted((root/'computations/verification').glob('*.py')):
              if '__main__' in p.read_text(): todo.append((p.stem,[sys.executable,str(p.relative_to(root))],p))
          p=root/'computations/analysis/spectral_diagnostics.py'
          todo.append(('spectral_diagnostics_verify',[sys.executable,str(p.relative_to(root)),'verify'],p))
          for p in sorted((root/'computations/cpp').glob('*.cpp')):
              exe=build/p.stem
              if not exe.is_file(): raise RuntimeError('unbuilt C++ source: '+str(p))
              todo.append(('cpp_'+p.stem,[str(exe)]+(['verify'] if p.stem=='cat_map_order' else []),p))
          def run(item):
              name,cmd,p=item; log=out/(name+'.log')
              with log.open('w') as stream:
                  try: code=subprocess.run(cmd,stdout=stream,stderr=subprocess.STDOUT,timeout=420).returncode
                  except subprocess.TimeoutExpired: code=124
              row={'name':name,'command':cmd,'source':str(p.relative_to(root)),
                   'source_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                   'exit_code':code,'log_sha256':hashlib.sha256(log.read_bytes()).hexdigest()}
              print(name,code,flush=True)
              if code: print(log.read_text()[-5000:],flush=True)
              return row
          with ThreadPoolExecutor(max_workers=2) as pool: rows=list(pool.map(run,todo))
          data={'input_commit':os.environ['GITHUB_SHA'],'producer':'.github/workflows/pell-echo-verification.yml',
                'scope':'Execution of source-hashed integrated worktree, not a complete proof audit or analytic Lean formalization.',
                'python':platform.python_version(),'numpy':numpy.__version__,'sympy':sympy.__version__,
                'passed':sum(r['exit_code']==0 for r in rows),'total':len(rows),'checks':rows}
          text=json.dumps(data,indent=2)+'\n'
          (out/'workspace_execution.json').write_text(text)
          (root/'record/weighted_echo_workspace_execution.json').write_text(text)
          if data['passed']!=data['total']: raise SystemExit('maintained verification failed')
          PY
      - name: Compile all finite Lean modules including the new coefficient identities
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd formalization
          set -o pipefail
          lake build 2>&1 | tee "$RUNNER_TEMP/echo-deliverables/checks/lean-build.log"
      - name: Compile the complete synchronized article
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- manuscript/pell_weighted_echo_section.tex)"
          export FORCE_SOURCE_DATE=1
          cd manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error arithmetic_cat_map_moments.tex
          if grep -q 'Overfull \\hbox' arithmetic_cat_map_moments.log; then
            echo 'Horizontal overflow; publication refused.'; exit 1
          fi
      - name: Publish only verified files, preserving concurrent work
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/echo-deliverables"
          if [ "$(git rev-parse HEAD)" != "$(git ls-remote origin refs/heads/main | cut -f1)" ]; then
            echo 'publication-skipped-main-moved' > "$out/SYNC_STATUS.txt"
            exit 0
          fi
          git config user.name 'WoW research validation'
          git config user.email 'research-validation@users.noreply.github.com'
          git add -u
          git add evidence/numerical/pell_gaussian_blocks.json evidence/numerical/goe_spacing.json \
            evidence/certificates/pell_floquet_audit.json evidence/certificates/spectral_lattice_clustering.json \
            evidence/certificates/pell_weighted_echo_audit.json record/weighted_echo_workspace_execution.json \
            assets/figures/pell_fourth_moment.png
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish verified weighted echo, microscopic obstruction, finite certificates, and article'
            git push origin HEAD:main
            echo "published $(git rev-parse HEAD)" > "$out/SYNC_STATUS.txt"
            gh workflow run pell-echo-verification.yml --ref main -f publish=false
          else
            echo "unchanged $(git rev-parse HEAD)" > "$out/SYNC_STATUS.txt"
          fi
      - name: Package source, evidence, and synchronization status
        if: success()
        run: |
          out="$RUNNER_TEMP/echo-deliverables"
          git rev-parse HEAD > "$out/COMMIT.txt"
          git archive --format=zip HEAD > "$out/WoW-weighted-echo.zip"
          git diff --binary > "$out/reviewed-worktree.patch"
          cp manuscript/arithmetic_cat_map_moments.pdf "$out/"
          cp evidence/certificates/pell_weighted_echo_audit.json "$out/"
          cp evidence/certificates/spectral_lattice_clustering.json "$out/"
          test -f "$out/SYNC_STATUS.txt" || echo 'validation-only; publication not requested' > "$out/SYNC_STATUS.txt"
          cd "$out"
          sha256sum WoW-weighted-echo.zip arithmetic_cat_map_moments.pdf \
            pell_weighted_echo_audit.json spectral_lattice_clustering.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weighted-echo-${{ github.run_id }}
          path: ${{ runner.temp }}/echo-deliverables/
          retention-days: 14
          if-no-files-found: warn
