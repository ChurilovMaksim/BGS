name: Smooth recurrence verification and publication
on:
  push:
    branches: [research/coboundary-resonance-20260905]
    paths:
      - '.github/workflows/smooth-recurrence-validation.yml'
      - 'mathematics/smooth_recurrence_and_compensation.md'
      - 'computations/verification/smooth_recurrence_and_compensation.py'
      - 'computations/maintenance/integrate_smooth_recurrence.py'
      - 'formalization/Bgs/PellFourierKernel.lean'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: smooth-recurrence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install scientific and document dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smooth-research/logs"
          python -m pip install -r requirements.txt matplotlib==3.10.8
          sudo apt-get update
          sudo apt-get install -y libboost-dev pandoc latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern poppler-utils
      - name: Integrate preserved research layers and check idempotence
        run: |
          set -euo pipefail
          if test -f computations/maintenance/integrate_pell_echo.py; then
            python computations/maintenance/integrate_pell_echo.py
          fi
          python computations/maintenance/integrate_smooth_recurrence.py --integrate-only
          before="$(git diff | sha256sum)"
          python computations/maintenance/integrate_smooth_recurrence.py --integrate-only
          test "$before" = "$(git diff | sha256sum)"
          python -W error::SyntaxWarning -m compileall -q computations
      - name: Build every maintained C++ source and regenerate new certificates
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/wow-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/wow-build" -j2
          python computations/verification/smooth_recurrence_and_compensation.py \
            --output evidence/certificates/smooth_recurrence_and_compensation.json \
            2>&1 | tee "$RUNNER_TEMP/smooth-research/logs/smooth-controls.log"
          python computations/verification/pell_coboundary_fourth_moment.py \
            --output evidence/certificates/pell_coboundary_fourth_moment.json
      - name: Execute all maintained Python and C++ verifiers
        run: |
          set -euo pipefail
          python computations/maintenance/verify_workspace.py \
            --build "$RUNNER_TEMP/wow-build" \
            --logs "$RUNNER_TEMP/smooth-research/logs/workspace" \
            --output evidence/certificates/smooth_workspace_execution.json \
            2>&1 | tee "$RUNNER_TEMP/smooth-research/logs/workspace-console.log"
      - name: Compile all imported Lean modules and retain the trust report
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          bash computations/maintenance/build_lean_verified.sh "$RUNNER_TEMP/smooth-research/logs/lean.log"
      - name: Render the proof and rebuild the main article
        run: |
          set -euo pipefail
          python computations/maintenance/integrate_smooth_recurrence.py
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- mathematics/smooth_recurrence_and_compensation.md)"
          export FORCE_SOURCE_DATE=1
          mkdir -p "$RUNNER_TEMP/smooth-research/paper-build" "$RUNNER_TEMP/smooth-research/renders"
          cd manuscript
          for paper in smooth_recurrence_and_compensation arithmetic_cat_map_moments; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error \
              -outdir="$RUNNER_TEMP/smooth-research/paper-build" "$paper.tex" \
              2>&1 | tee "$RUNNER_TEMP/smooth-research/logs/$paper.log"
            if grep -q 'Overfull \\hbox' "$RUNNER_TEMP/smooth-research/paper-build/$paper.log"; then
              echo "Horizontal overflow in $paper"; exit 1
            fi
            cp "$RUNNER_TEMP/smooth-research/paper-build/$paper.pdf" .
          done
          pdftoppm -png -scale-to 1100 smooth_recurrence_and_compensation.pdf \
            "$RUNNER_TEMP/smooth-research/renders/page" >/dev/null 2>&1
          cd ..
          python computations/verification/repository_audit.py
      - name: Write validation manifest only after all preceding checks pass
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          import numpy,sympy
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          paths += ['manuscript/smooth_recurrence_section.tex',
                    'manuscript/smooth_recurrence_and_compensation.tex',
                    'manuscript/smooth_recurrence_and_compensation.pdf',
                    'evidence/certificates/smooth_recurrence_and_compensation.json',
                    'evidence/certificates/smooth_workspace_execution.json']
          hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
                  for p in sorted(set(paths)) if Path(p).is_file()
                  and Path(p).suffix in ('.py','.cpp','.lean','.md','.tex','.json','.yml')}
          data={'producer':'.github/workflows/smooth-recurrence-validation.yml',
                'status':'PASS','input_commit':os.environ['GITHUB_SHA'],
                'run_id':os.environ['GITHUB_RUN_ID'],
                'scope':'All maintained executable Python/C++ verifiers, imported Lean modules, two TeX builds and repository audit on the integrated worktree. Not an external mathematical referee review or a full analytic Lean proof. Rendered pages are retained for visual review; rendering alone is not visual certification.',
                'python':platform.python_version(),'numpy':numpy.__version__,
                'sympy':sympy.__version__,'source_sha256':hashes}
          Path('evidence/certificates/smooth_recurrence_validation.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Publish without overwriting a moved branch or main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF#refs/heads/}"
          test "$branch" = 'research/coboundary-resonance-20260905'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'WoW research verification'
          git config user.email 'research-verification@users.noreply.github.com'
          git add README.md mathematics/results.md record/claim_ledger.md formalization/Bgs.lean \
            .github/workflows/coboundary-validation.yml \
            computations/verification/pell_weighted_echo_regression.py \
            computations/verification/pell_coboundary_fourth_moment.py \
            evidence/certificates/pell_coboundary_validation.json \
            evidence/certificates/pell_coboundary_fourth_moment.json \
            evidence/certificates/smooth_recurrence_and_compensation.json \
            evidence/certificates/smooth_workspace_execution.json \
            evidence/certificates/smooth_recurrence_validation.json \
            manuscript/smooth_recurrence_section.tex \
            manuscript/smooth_recurrence_and_compensation.tex \
            manuscript/smooth_recurrence_and_compensation.pdf \
            manuscript/arithmetic_cat_map_moments.tex manuscript/arithmetic_cat_map_moments.pdf \
            assets/figures/smooth_recurrence_compensation.png
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish verified smooth recurrence proofs, complete checks and articles'
            git push origin "HEAD:$branch"
          fi
          git fetch origin main
          expected="$(git rev-parse origin/main)"
          if git merge-base --is-ancestor "$expected" HEAD && \
             test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$expected"; then
            git push origin HEAD:main
            gh workflow run ci.yml --ref main
            echo "main synchronized to $(git rev-parse HEAD)" > "$RUNNER_TEMP/smooth-research/PUBLICATION.txt"
          else
            echo 'main advanced independently; research branch published, main left unchanged.' > "$RUNNER_TEMP/smooth-research/PUBLICATION.txt"
          fi
      - name: Package committed sources, proof and actual execution records
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/smooth-research"
          git rev-parse HEAD > "$out/COMMIT.txt"
          git archive --format=zip -o "$out/WoW-smooth-source.zip" HEAD
          cp manuscript/smooth_recurrence_and_compensation.pdf "$out/"
          cp evidence/certificates/smooth_recurrence_and_compensation.json "$out/"
          cp evidence/certificates/smooth_recurrence_validation.json "$out/"
          cp evidence/certificates/smooth_workspace_execution.json "$out/"
          cd "$out"
          sha256sum WoW-smooth-source.zip smooth_recurrence_and_compensation.pdf \
            smooth_recurrence_and_compensation.json smooth_recurrence_validation.json \
            smooth_workspace_execution.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smooth-recurrence-${{ github.run_id }}
          path: ${{ runner.temp }}/smooth-research/
          retention-days: 14
          if-no-files-found: warn
