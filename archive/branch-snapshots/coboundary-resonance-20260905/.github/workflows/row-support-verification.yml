name: Row-support exact verification

on:
  push:
    branches: [main]
    paths:
      - 'mathematics/cayley_*row*.md'
      - 'mathematics/cayley_*subresultant*.md'
      - 'mathematics/cayley_*transversality*.md'
      - 'mathematics/cayley_inverse_*.md'
      - 'computations/verification/cayley_*row*.py'
      - 'computations/verification/cayley_*subresultant*.py'
      - 'computations/verification/cayley_*transversality*.py'
      - 'computations/verification/cayley_inverse_*.py'
      - '.github/workflows/row-support-verification.yml'
  pull_request:
    paths:
      - 'mathematics/cayley_*row*.md'
      - 'mathematics/cayley_*subresultant*.md'
      - 'mathematics/cayley_*transversality*.md'
      - 'mathematics/cayley_inverse_*.md'
      - 'computations/verification/cayley_*row*.py'
      - 'computations/verification/cayley_*subresultant*.py'
      - 'computations/verification/cayley_*transversality*.py'
      - 'computations/verification/cayley_inverse_*.py'
      - '.github/workflows/row-support-verification.yml'

permissions:
  contents: read

jobs:
  exact-row-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install exact Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile maintained Python without syntax warnings
        run: python -W error::SyntaxWarning -m compileall -q computations/verification

      - name: Regress fixed-product row geometry
        run: python computations/verification/cayley_product_row_intersections.py

      - name: Regress specialization-safe real-trace support
        run: python computations/verification/cayley_product_row_real_trace_ideal.py

      - name: Regress principal-subresultant scalar support
        run: python computations/verification/cayley_principal_subresultant_support.py

      - name: Regress scalar shift-resultant support
        run: python computations/verification/cayley_trace_intercept_shift_resultant.py

      - name: Regress shift/PSC transversality
        run: python computations/verification/cayley_shift_psc_transversality.py

      - name: Regress inverse reflection
        run: python computations/verification/cayley_product_row_reflection.py

      - name: Regress inverse pair-sum factorization
        run: python computations/verification/cayley_inverse_pair_sum_factorization.py

      - name: Regress inverse resultant transversality
        run: python computations/verification/cayley_inverse_resultant_transversality.py
