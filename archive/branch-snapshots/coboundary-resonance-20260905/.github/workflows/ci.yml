name: Scientific verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  computation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies and build all C++ verifiers
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y libboost-dev
          cmake -S . -B "$RUNNER_TEMP/wow-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/wow-build" -j2
      - name: Compile and execute every maintained Python and C++ verifier
        run: |
          python -W error::SyntaxWarning -m compileall -q computations
          python computations/maintenance/verify_workspace.py --build "$RUNNER_TEMP/wow-build" --logs "$RUNNER_TEMP/checks" --output "$RUNNER_TEMP/workspace.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-computation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/checks/
            ${{ runner.temp }}/workspace.json
  formalization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Audit active modules and compile all finite formal certificates
        run: |
          python computations/verification/repository_audit.py
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd formalization
          lake build
  manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
      - name: Compile the committed articles independently
        run: |
          mkdir -p "$RUNNER_TEMP/paper"
          cd manuscript
          for paper in arithmetic_cat_map_moments pell_floquet_normal_form cyclotomic_row_support_frontier; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir="$RUNNER_TEMP/paper" "$paper.tex"
            test -s "$RUNNER_TEMP/paper/$paper.pdf"
          done
