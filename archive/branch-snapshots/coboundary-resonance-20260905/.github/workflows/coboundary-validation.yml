name: Coboundary resonance verification
on:
  push:
    branches: [main, research/coboundary-resonance-20260905]
    paths:
      - '.github/workflows/coboundary-validation.yml'
      - 'computations/verification/pell_coboundary_regression.py'
      - 'computations/cpp/pell_coboundary_pairs.cpp'
      - 'computations/maintenance/publish_coboundary.py'
      - 'mathematics/pell_coboundary_resonance.md'
      - 'formalization/Bgs/PellCoboundary.lean'
      - 'manuscript/pell_coboundary_section.tex'
      - 'mathematics/pell_coboundary_fourth_moment.md'
      - 'computations/verification/pell_coboundary_fourth_moment.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coboundary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install and register the coupled verification layers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coboundary/logs"
          python -m pip install -r requirements.txt scipy==1.17.0 matplotlib==3.10.8
          python computations/maintenance/publish_coboundary.py --integrate-only
          before="$(git diff | sha256sum)"
          python computations/maintenance/publish_coboundary.py --integrate-only
          test "$before" = "$(git diff | sha256sum)"
          python -W error::SyntaxWarning -m compileall -q computations
          sudo apt-get update
          sudo apt-get install -y libboost-dev pandoc latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
      - name: Compile independent C++ and run exact and extended numerical checks
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/wow-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/wow-build" -j2
          python computations/verification/pell_coboundary_regression.py \
            --cpp "$RUNNER_TEMP/wow-build/pell_coboundary_pairs" \
            --extended --probes 4 \
            --output evidence/certificates/pell_coboundary_audit.json \
            2>&1 | tee "$RUNNER_TEMP/coboundary/logs/coboundary.log"
      - name: Compile all imported Lean certificates with failure propagation
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          bash computations/maintenance/build_lean_verified.sh "$RUNNER_TEMP/coboundary/logs/lean.log"
      - name: Render evidence and independently compile both updated papers
        run: |
          set -euo pipefail
          python computations/maintenance/publish_coboundary.py
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- mathematics/pell_coboundary_resonance.md)"
          export FORCE_SOURCE_DATE=1
          mkdir -p "$RUNNER_TEMP/coboundary/paper-build"
          cd manuscript
          for paper in pell_coboundary_resonance arithmetic_cat_map_moments; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error \
              -outdir="$RUNNER_TEMP/coboundary/paper-build" "$paper.tex" \
              2>&1 | tee "$RUNNER_TEMP/coboundary/logs/$paper.log"
            if grep -q 'Overfull \\hbox' "$RUNNER_TEMP/coboundary/paper-build/$paper.log"; then
              echo "Horizontal overflow in $paper"; exit 1
            fi
            cp "$RUNNER_TEMP/coboundary/paper-build/$paper.pdf" .
          done
          cd ..
          python computations/verification/repository_audit.py
      - name: Record exact source and check scope
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          import numpy,scipy,mpmath
          paths=['mathematics/pell_coboundary_fourth_moment.md',
                 'computations/verification/pell_coboundary_fourth_moment.py',
                 'evidence/certificates/pell_coboundary_fourth_moment.json',
                 'mathematics/pell_coboundary_resonance.md',
                 'computations/verification/pell_coboundary_regression.py',
                 'computations/verification/pell_floquet_regression.py',
                 'computations/cpp/pell_coboundary_pairs.cpp',
                 'formalization/Bgs/PellCoboundary.lean',
                 'computations/maintenance/publish_coboundary.py',
                 'manuscript/pell_coboundary_section.tex',
                 'manuscript/pell_coboundary_resonance.tex',
                 'manuscript/pell_coboundary_resonance.pdf',
                 'evidence/certificates/pell_coboundary_audit.json']
          logs=Path(os.environ['RUNNER_TEMP'])/'coboundary/logs'
          data={'input_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                'status':'PASS','scope':'Targeted Python/C++ exact and numerical checks, all imported Lean modules, two TeX builds and repository audit. Not all historical Python verifiers, full analytic formalization, or an external proof review.',
                'python':platform.python_version(),'numpy':numpy.__version__,'scipy':scipy.__version__,'mpmath':mpmath.__version__,
                'sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},
                'logs':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(logs.glob('*.log'))}}
          Path('evidence/certificates/pell_coboundary_validation.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Publish reviewed derived files on the research branch only
        if: startsWith(github.ref, 'refs/heads/research/coboundary-')
        run: |
          set -euo pipefail
          branch="${GITHUB_REF#refs/heads/}"
          remote="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'WoW research verification'
          git config user.email 'research-verification@users.noreply.github.com'
          git add CMakeLists.txt formalization/Bgs.lean README.md mathematics/results.md \
            record/claim_ledger.md manuscript/arithmetic_cat_map_moments.tex \
            manuscript/arithmetic_cat_map_moments.pdf manuscript/pell_coboundary_resonance.tex \
            manuscript/pell_coboundary_resonance.pdf assets/figures/pell_coboundary_fourth.png \
            assets/figures/pell_coboundary_echo.png evidence/certificates/pell_coboundary_audit.json \
            evidence/certificates/pell_coboundary_validation.json \
            evidence/certificates/pell_coboundary_fourth_moment.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish verified coboundary evidence, finite certificates and papers [skip ci]'
            git push origin "HEAD:$branch"
          fi
      - name: Package the actual committed source and review artifacts
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/coboundary"
          git rev-parse HEAD > "$out/COMMIT.txt"
          git archive --format=zip -o "$out/WoW-coboundary-source.zip" HEAD
          cp manuscript/pell_coboundary_resonance.pdf "$out/"
          cp evidence/certificates/pell_coboundary_audit.json "$out/"
          cp evidence/certificates/pell_coboundary_validation.json "$out/"
          cd "$out"
          sha256sum WoW-coboundary-source.zip pell_coboundary_resonance.pdf \
            pell_coboundary_audit.json pell_coboundary_validation.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coboundary-research-${{ github.run_id }}
          path: ${{ runner.temp }}/coboundary/
          retention-days: 14
          if-no-files-found: warn
