name: Repository health

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'repair/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check repository structure and provenance boundary
        run: python tools/check_repository.py --check structure

      - name: Compile broad research code Python
        run: python tools/check_repository.py --check python --python-root code

      - name: Compile supported src Python
        run: python tools/check_repository.py --check python --python-root src

      - name: Compile experiment Python
        run: python tools/check_repository.py --check python --python-root experiments

      - name: Compile repository tool Python
        run: python tools/check_repository.py --check python --python-root tools

      - name: Parse research and current JSON corpus
        run: python tools/check_repository.py --check json

      - name: Install exact C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev

      - name: Prepare C++ build directory
        run: mkdir -p build/ci

      - name: Compile C++ cat-map order scanner
        run: g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror src/cpp/number_theory/catmap_order.cpp -o build/ci/catmap_order

      - name: Compile C++ relation automaton
        run: g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror src/cpp/shape/relation_automaton.cpp -o build/ci/relation_automaton

      - name: Compile C++ fourth-moment verifier
        run: g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror src/cpp/verification/fourth_moment_factorization.cpp -o build/ci/fourth_moment_factorization

      - name: Run migrated exact regression gates
        shell: bash
        run: |
          set -euo pipefail
          build/ci/catmap_order verify
          build/ci/relation_automaton verify
          build/ci/fourth_moment_factorization
          python experiments/verification/sol6_relation_count.py --verify
