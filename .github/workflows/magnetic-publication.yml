name: Magnetic research verification and publication

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish reviewed integration and generated artifacts
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/magnetic-publication.yml'
      - 'computations/maintenance/integrate_magnetic_audit.py'
      - 'computations/python/bgs/magnetic_quotient.py'
      - 'computations/cpp/magnetic_word_verifier.cpp'
      - 'computations/verification/magnetic_quotient_regression.py'
      - 'computations/verification/cdf_sup_regression.py'
      - 'computations/analysis/magnetic_spectrum_figure.py'
      - 'formalization/Bgs/MagneticTraceSmall.lean'
      - 'mathematics/magnetic_quotient_semicircle.md'

permissions:
  contents: write
  actions: write

concurrency:
  group: magnetic-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt matplotlib==3.10.0
      - name: Apply reviewed integration and check idempotence
        run: |
          python computations/maintenance/integrate_magnetic_audit.py
          before="$(git diff | sha256sum)"
          python computations/maintenance/integrate_magnetic_audit.py
          after="$(git diff | sha256sum)"
          test "$before" = "$after"
          python -W error::SyntaxWarning -m compileall -q computations
      - name: Build all maintained C++ programs outside the source tree
        run: |
          cmake -S . -B "$RUNNER_TEMP/wow-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/wow-build" -j2
      - name: Generate exact independent magnetic certificate
        run: |
          python computations/verification/magnetic_quotient_regression.py \
            --cpp "$RUNNER_TEMP/wow-build/magnetic_word_verifier" \
            --output evidence/certificates/magnetic_quotient_audit.json
      - name: Regenerate corrected descriptive spacing output and global illustration
        run: |
          python computations/analysis/spectral_diagnostics.py spacing > "$RUNNER_TEMP/goe_spacing.json"
          mv "$RUNNER_TEMP/goe_spacing.json" evidence/numerical/goe_spacing.json
          python computations/analysis/magnetic_spectrum_figure.py
      - name: Run every maintained executable verifier and retain provenance
        run: |
          mkdir -p "$RUNNER_TEMP/research-deliverables/checks"
          python - <<'PY'
          import concurrent.futures as cf
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          import numpy, sympy
          root=Path.cwd(); out=Path(os.environ['RUNNER_TEMP'])/'research-deliverables/checks'
          todo=[]
          for p in sorted((root/'computations/verification').glob('*.py')):
              if '__main__' in p.read_text():
                  todo.append((p.stem,['python',str(p.relative_to(root))],p))
          p=root/'computations/analysis/spectral_diagnostics.py'
          todo.append(('spectral_diagnostics_verify',['python',str(p.relative_to(root)),'verify'],p))
          build=Path(os.environ['RUNNER_TEMP'])/'wow-build'
          for p in sorted((root/'computations/cpp').glob('*.cpp')):
              exe=build/p.stem
              if not exe.is_file(): raise RuntimeError('unbuilt C++ source: '+str(p))
              cmd=[str(exe)]+(['verify'] if p.stem=='cat_map_order' else [])
              todo.append(('cpp_'+p.stem,cmd,p))
          def run(item):
              name,cmd,source=item; status='error'; code=None
              try:
                  with (out/(name+'.log')).open('w') as log:
                      proc=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=360)
                  code=proc.returncode; status='pass' if code==0 else 'fail'
              except subprocess.TimeoutExpired: status='timeout'
              row={'name':name,'command':cmd,'source':str(source.relative_to(root)),
                   'source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
                   'status':status,'exit_code':code,
                   'log_sha256':hashlib.sha256((out/(name+'.log')).read_bytes()).hexdigest()}
              print(name,status,flush=True)
              if status!='pass': print((out/(name+'.log')).read_text()[-6000:],flush=True)
              return row
          with cf.ThreadPoolExecutor(max_workers=2) as pool: rows=list(pool.map(run,todo))
          data={'producer':'.github/workflows/magnetic-publication.yml',
                'scope':'Execution of every maintained executable verifier on the integrated working tree. This is not a complete proof audit or an analytic Lean formalization.',
                'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                'python':platform.python_version(),'numpy':numpy.__version__,'sympy':sympy.__version__,
                'checks':rows,'passed':sum(r['status']=='pass' for r in rows),'total':len(rows)}
          text=json.dumps(data,indent=2)+'\n'
          (out/'workspace_execution.json').write_text(text)
          (root/'evidence/certificates/workspace_execution_20260905.json').write_text(text)
          if data['passed']!=data['total']: raise SystemExit('maintained verification failed')
          PY
      - name: Install official Lean toolchain and compile all formal modules
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd formalization
          lake --version
          lake build 2>&1 | tee "$RUNNER_TEMP/research-deliverables/checks/lean-build.log"
      - name: Install article build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
      - name: Build the companion article from the proof source
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- mathematics/magnetic_quotient_semicircle.md)"
          export FORCE_SOURCE_DATE=1
          mkdir -p "$RUNNER_TEMP/magnetic-paper"
          pandoc mathematics/magnetic_quotient_semicircle.md -s -t latex \
            -V fontsize=11pt -V geometry:margin=25mm \
            -o manuscript/magnetic_quotient_semicircle.tex
          for pass in 1 2; do
            pdflatex -interaction=nonstopmode -halt-on-error \
              -output-directory="$RUNNER_TEMP/magnetic-paper" \
              manuscript/magnetic_quotient_semicircle.tex
          done
          cp "$RUNNER_TEMP/magnetic-paper/magnetic_quotient_semicircle.pdf" manuscript/
          python computations/verification/repository_audit.py
      - name: Publish verified derived files with a branch-head guard
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt formalization/Bgs.lean \
            computations/analysis/spectral_diagnostics.py \
            computations/verification/repository_audit.py \
            computations/cpp/magnetic_word_verifier.cpp \
            mathematics/cayley_direct_energy.md README.md mathematics/results.md \
            record/claim_ledger.md record/retractions.md \
            evidence/numerical/goe_spacing.json \
            evidence/numerical/magnetic_quotient_global.json \
            evidence/certificates/magnetic_quotient_audit.json \
            evidence/certificates/workspace_execution_20260905.json \
            manuscript/magnetic_quotient_semicircle.tex \
            manuscript/magnetic_quotient_semicircle.pdf \
            assets/magnetic_quotient_global.svg assets/magnetic_quotient_global.png
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git commit -m 'research: integrate verified magnetic theorem, corrections, and reproducible article'
          git push origin HEAD:main
          echo "Published $(git rev-parse HEAD)"
          # GITHUB_TOKEN pushes do not trigger push workflows. Explicitly check
          # the resulting main head; the dispatched run does not publish again.
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/magnetic-publication.yml/dispatches" \
            -f ref=main -f 'inputs[publish]=false'
      - name: Package the actual committed source and verified deliverables
        if: success()
        run: |
          out="$RUNNER_TEMP/research-deliverables"
          git rev-parse HEAD > "$out/COMMIT.txt"
          git archive --format=tar.gz -o "$out/WoW-reviewed-main.tar.gz" HEAD
          cp manuscript/magnetic_quotient_semicircle.pdf "$out/"
          cp assets/magnetic_quotient_global.png "$out/"
          cp evidence/certificates/magnetic_quotient_audit.json "$out/"
          cd "$out"
          sha256sum WoW-reviewed-main.tar.gz magnetic_quotient_semicircle.pdf \
            magnetic_quotient_global.png magnetic_quotient_audit.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magnetic-research-${{ github.run_id }}
          path: ${{ runner.temp }}/research-deliverables/
          retention-days: 7
          if-no-files-found: warn
