name: Repair magnetic finite anchors
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-magnetic-finite-anchor.yml']
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Replace literal anchors by an independent cyclic-convolution identity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('formalization/Bgs/MagneticTraceSmall.lean')
          s=p.read_text();a=s.index('theorem trace1 :');b=s.index('end Bgs.MagneticTraceSmall',a)
          replacement='''/- On the one-dimensional odd block at p=7,K=3,
          A_q=(z^2+z^5-z-z^6-1)/3, z=e_7(q).
          Hence the trace histogram is 2 times the m-th cyclic power of S.
          This calculation is independent of affine-word enumeration. -/
          def baseCoefficients : List Int := [-1,-1,1,0,0,1,-1]

          def cyclicConvolution (a b : List Int) : List Int :=
            (List.range 7).map (fun t =>
              (List.range 7).foldl (fun acc j =>
                acc + a.getD j 0 * b.getD ((t+7-j)%7) 0) 0)

          def coefficientPower : Nat -> List Int
            | 0 => [1,0,0,0,0,0,0]
            | m+1 => cyclicConvolution (coefficientPower m) baseCoefficients

          def closedCanonical (m : Nat) : List Int :=
            let c := (coefficientPower m).map (fun x => 2*x)
            c.map (fun x => x-c.getD 6 0)

          theorem first_closed_anchor : closedCanonical 1 = [0,0,4,2,2,4,0] := by native_decide
          theorem trace1 : canonical 1 = closedCanonical 1 := by native_decide
          theorem trace2 : canonical 2 = closedCanonical 2 := by native_decide
          theorem trace3 : canonical 3 = closedCanonical 3 := by native_decide
          theorem trace4 : canonical 4 = closedCanonical 4 := by native_decide
          '''
          p.write_text(s[:a]+replacement+s[b:])
          p=Path('computations/verification/magnetic_quotient_regression.py');s=p.read_text()
          old='            C=word_histogram(p,H,m);can=canonical_histogram(p,C)'
          new=old+'\n            if p==7 and m==1: assert can==[0,0,4,2,2,4,0], can'
          if old not in s:raise RuntimeError('expected regression insertion point absent')
          p.write_text(s.replace(old,new,1))
          p=Path('record/referee_audit_20260905.md')
          p.write_text(p.read_text()+'''\n## Correction of a newly transcribed Lean anchor

          During this pass, the first literal Lean histogram was independently
          found to be wrong before a successful Lean build was claimed. On the
          one-dimensional odd block at p=7,K=3, direct character summation gives
          A_q=(z^2+z^5-z-z^6-1)/3. The canonical first histogram is therefore
          [0,0,4,2,2,4,0], not the initially transcribed vector. All four literal
          anchors were replaced by equality with independently constructed cyclic
          convolution powers of this polynomial. The analytic global-law proof
          does not depend on those finite vectors. Compilation status is a
          separate, mandatory CI check, not inferred from source inspection.
          ''')
          PY
      - name: Commit only the reviewed repair and remove this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-magnetic-finite-anchor.yml
          git add formalization/Bgs/MagneticTraceSmall.lean \
            computations/verification/magnetic_quotient_regression.py \
            record/referee_audit_20260905.md
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git commit -m 'fix: independently derive magnetic finite anchors before Lean certification'
          git push origin HEAD:main
          # Cancel obsolete instances of our publication workflow, then verify
          # and publish the corrected source head. No unrelated workflow is touched.
          for status in in_progress queued; do
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/magnetic-publication.yml/runs?status=$status" --jq '.workflow_runs[].id'); do
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" || true
            done
          done
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/magnetic-publication.yml/dispatches" \
            -f ref=main -f 'inputs[publish]=true'
