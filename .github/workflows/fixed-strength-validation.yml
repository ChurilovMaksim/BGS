name: Fixed-strength locality verification
on:
  push:
    branches: [main, research/fixed-strength-locality-20260905]
    paths:
      - '.github/workflows/fixed-strength-validation.yml'
      - 'mathematics/fixed_strength_locality.md'
      - 'computations/verification/fixed_strength_locality.py'
      - 'computations/verification/fixed_strength_classical.py'
      - 'computations/cpp/fixed_strength_locality_exact.cpp'
      - 'formalization/Bgs/LocalityKernels.lean'
      - 'computations/maintenance/publish_fixed_strength.py'
      - 'manuscript/fixed_strength_section.tex'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fixed-strength-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Integrate source once, install dependencies, freeze inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/locality/logs"
          python computations/maintenance/publish_fixed_strength.py --integrate-only
          before="$(git diff | sha256sum)"
          python computations/maintenance/publish_fixed_strength.py --integrate-only
          test "$before" = "$(git diff | sha256sum)"
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y libboost-dev pandoc latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          paths=[]
          for directory in ('computations','formalization','mathematics'):
              paths.extend(p for p in Path(directory).rglob('*') if p.suffix in ('.py','.cpp','.lean','.md') and '.lake' not in p.parts)
          data={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(paths)}
          Path(os.environ['RUNNER_TEMP'],'locality/source-before.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Build and execute every maintained Python and C++ verifier
        run: |
          set -euo pipefail
          python -W error::SyntaxWarning -m compileall -q computations
          cmake -S . -B "$RUNNER_TEMP/wow-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/wow-build" -j2
          python computations/maintenance/verify_workspace.py --build "$RUNNER_TEMP/wow-build" \
            --logs "$RUNNER_TEMP/locality/logs/workspace" --output "$RUNNER_TEMP/locality/workspace.json" \
            2>&1 | tee "$RUNNER_TEMP/locality/logs/workspace.log"
          python computations/verification/fixed_strength_locality.py --extended \
            --output evidence/certificates/fixed_strength_locality.json \
            2>&1 | tee "$RUNNER_TEMP/locality/logs/extended.log"
          python computations/verification/fixed_strength_classical.py \
            --output evidence/certificates/fixed_strength_classical.json
          "$RUNNER_TEMP/wow-build/fixed_strength_locality_exact" \
            > evidence/certificates/fixed_strength_locality_cpp.json
      - name: Compile all imported Lean modules and check the frozen inputs
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          bash computations/maintenance/build_lean_verified.sh "$RUNNER_TEMP/locality/logs/lean.log"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          before=json.loads(Path(os.environ['RUNNER_TEMP'],'locality/source-before.json').read_text())
          for name,digest in before.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          print('Frozen scientific source hashes agree:',len(before))
          PY
      - name: Render and compile the companion and integrated main paper
        run: |
          set -euo pipefail
          python computations/maintenance/publish_fixed_strength.py
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- mathematics/fixed_strength_locality.md)"
          export FORCE_SOURCE_DATE=1
          mkdir -p "$RUNNER_TEMP/locality/paper-build"
          cd manuscript
          for paper in fixed_strength_locality arithmetic_cat_map_moments; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error \
              -outdir="$RUNNER_TEMP/locality/paper-build" "$paper.tex" \
              2>&1 | tee "$RUNNER_TEMP/locality/logs/$paper.log"
            if grep -q 'Overfull \\hbox' "$RUNNER_TEMP/locality/paper-build/$paper.log"; then
              echo "Horizontal overflow in $paper"; exit 1
            fi
            cp "$RUNNER_TEMP/locality/paper-build/$paper.pdf" .
          done
          cd ..
          python computations/verification/repository_audit.py \
            2>&1 | tee "$RUNNER_TEMP/locality/logs/repository-audit.log"
      - name: Record verification scope, versions and source/output hashes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          import numpy,scipy,mpmath,matplotlib
          out=Path(os.environ['RUNNER_TEMP'])/'locality'
          workspace=json.loads((out/'workspace.json').read_text())
          assert workspace['passed']==workspace['total']
          import ast
          py=json.loads(Path('evidence/certificates/fixed_strength_locality.json').read_text())
          cpp=json.loads(Path('evidence/certificates/fixed_strength_locality_cpp.json').read_text())
          py_coeff={ast.literal_eval(k):v for k,v in py['poisson_only_negative_control']['third_moyal_coefficient'].items()}
          cpp_coeff={(x,y):a for x,y,a in cpp['third_moyal_coefficient']}
          assert py_coeff==cpp_coeff
          paths=['computations/verification/fixed_strength_classical.py',
                 'evidence/certificates/fixed_strength_classical.json',
                 'mathematics/fixed_strength_locality.md',
                 'computations/verification/fixed_strength_locality.py',
                 'computations/cpp/fixed_strength_locality_exact.cpp',
                 'formalization/Bgs/LocalityKernels.lean',
                 'computations/maintenance/publish_fixed_strength.py',
                 'manuscript/fixed_strength_section.tex',
                 'manuscript/fixed_strength_locality.tex',
                 'manuscript/fixed_strength_locality.pdf',
                 'manuscript/arithmetic_cat_map_moments.pdf',
                 'evidence/certificates/fixed_strength_locality.json',
                 'evidence/certificates/fixed_strength_locality_cpp.json']
          data={'producer':'.github/workflows/fixed-strength-validation.yml',
                'input_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                'status':'PASS','scope':'All maintained executable Python/C++ verifiers, additional fixed-strength matrices, all imported Lean modules, two article builds and structural audit. Not a complete mathematical proof audit, analytic Lean formalization, or interval certification.',
                'independent_moyal_coefficients_agree':True,
                'workspace_passed':workspace['passed'],'workspace_total':workspace['total'],
                'versions':{'python':platform.python_version(),'numpy':numpy.__version__,'scipy':scipy.__version__,'mpmath':mpmath.__version__,'matplotlib':matplotlib.__version__},
                'frozen_scientific_sources':json.loads((out/'source-before.json').read_text()),
                'sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},
                'log_sha256':{str(p.relative_to(out)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted((out/'logs').rglob('*.log'))}}
          Path('evidence/certificates/fixed_strength_validation.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          python computations/verification/repository_audit.py
      - name: Publish verified derivatives on the research branch only
        if: github.ref == 'refs/heads/research/fixed-strength-locality-20260905'
        run: |
          set -euo pipefail
          branch="${GITHUB_REF#refs/heads/}"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'WoW research verification'
          git config user.email 'research-verification@users.noreply.github.com'
          git add CMakeLists.txt requirements.txt README.md mathematics/results.md \
            record/claim_ledger.md formalization/Bgs.lean \
            computations/verification/pell_weighted_echo_regression.py \
            mathematics/fixed_strength_locality.md \
            manuscript/arithmetic_cat_map_moments.tex manuscript/arithmetic_cat_map_moments.pdf \
            manuscript/fixed_strength_locality.tex manuscript/fixed_strength_locality.pdf \
            assets/figures/fixed_strength_support.png assets/figures/fixed_strength_conjugacy.png \
            evidence/certificates/fixed_strength_locality.json \
            evidence/certificates/fixed_strength_locality_cpp.json \
            evidence/certificates/fixed_strength_classical.json \
            evidence/certificates/fixed_strength_validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish verified fixed-strength locality evidence, kernels and articles'
            git push origin "HEAD:$branch"
          fi
      - name: Package exact committed sources and review artifacts
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/locality"
          git rev-parse HEAD > "$out/COMMIT.txt"
          git status --short > "$out/worktree-status.txt"
          git archive --format=zip -o "$out/WoW-fixed-strength-source.zip" HEAD
          cp manuscript/fixed_strength_locality.pdf "$out/"
          cp manuscript/arithmetic_cat_map_moments.pdf "$out/"
          cp evidence/certificates/fixed_strength_locality.json "$out/"
          cp evidence/certificates/fixed_strength_locality_cpp.json "$out/"
          cp evidence/certificates/fixed_strength_classical.json "$out/"
          cp evidence/certificates/fixed_strength_validation.json "$out/"
          cd "$out"
          sha256sum WoW-fixed-strength-source.zip fixed_strength_locality.pdf \
            arithmetic_cat_map_moments.pdf fixed_strength_locality.json \
            fixed_strength_locality_cpp.json fixed_strength_classical.json fixed_strength_validation.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-strength-research-${{ github.run_id }}
          path: ${{ runner.temp }}/locality/
          retention-days: 14
          if-no-files-found: warn
