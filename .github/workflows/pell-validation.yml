name: Complete research validation and publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pell-validation.yml'
      - 'record/floquet_source_patch_*.diff'
      - 'mathematics/pell_floquet_normal_form.md'
      - 'computations/verification/pell_floquet_regression.py'
      - 'computations/verification/pell_gamma_interval.py'
      - 'computations/maintenance/render_pell_floquet.py'
      - 'computations/analysis/pell_floquet_figure.py'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish regenerated evidence only after all checks pass
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: reviewed-research-publication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply the literal reviewed source patch once, never guessed replacements
        run: |
          shopt -s nullglob
          patches=(record/floquet_source_patch_*.diff)
          if ((${#patches[@]})); then
            for patch in "${patches[@]}"; do
              git apply --check "$patch"
              git apply "$patch"
              rm "$patch"
            done
          fi
          mkdir -p "$RUNNER_TEMP/deliverables/checks"
      - name: Install pinned scientific dependencies and build tools
        run: |
          python -m pip install -r requirements.txt matplotlib==3.10.5
          sudo apt-get update
          sudo apt-get install -y libboost-dev pandoc latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
          cmake -S . -B "$RUNNER_TEMP/wow-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/wow-build" -j2
      - name: Regenerate exact certificates, complete diagnostics and corrected CDF
        run: |
          python computations/verification/pell_gamma_interval.py --output evidence/certificates/pell_gamma_interval.json
          python computations/verification/pell_gaussian_regression.py --output evidence/numerical/pell_gaussian_blocks.json --figure assets/figures/pell_fourth_moment.png
          python computations/verification/pell_floquet_regression.py --cpp "$RUNNER_TEMP/wow-build/pell_pair_orthogonality" --extended --probes 32 --output evidence/certificates/pell_floquet_audit.json
          python computations/verification/magnetic_quotient_regression.py --cpp "$RUNNER_TEMP/wow-build/magnetic_word_verifier" --output evidence/certificates/magnetic_quotient_audit.json
          python computations/analysis/spectral_diagnostics.py spacing > evidence/numerical/goe_spacing.json
          python computations/analysis/magnetic_spectrum_figure.py
          python computations/analysis/pell_floquet_figure.py
          python -W error::SyntaxWarning -m compileall -q computations
      - name: Execute every maintained Python and C++ verifier with source hashes
        run: |
          python computations/maintenance/verify_workspace.py --build "$RUNNER_TEMP/wow-build" --logs "$RUNNER_TEMP/deliverables/checks" --output evidence/certificates/floquet_workspace_execution.json --workers 2
      - name: Compile every active Lean module, including the new finite certificates
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd formalization
          lake build 2>&1 | tee "$RUNNER_TEMP/deliverables/checks/lean-build.log"
      - name: Build synchronized articles from the verified sources
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- mathematics/pell_floquet_normal_form.md)"
          export FORCE_SOURCE_DATE=1
          python computations/maintenance/render_pell_floquet.py
          pandoc mathematics/magnetic_quotient_semicircle.md -s -t latex -V fontsize=11pt -V geometry:margin=25mm -o manuscript/magnetic_quotient_semicircle.tex
          mkdir -p "$RUNNER_TEMP/paper"
          cd manuscript
          for paper in arithmetic_cat_map_moments pell_floquet_normal_form magnetic_quotient_semicircle cyclotomic_row_support_frontier; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir="$RUNNER_TEMP/paper" "$paper.tex" > "$RUNNER_TEMP/deliverables/checks/$paper-tex.log" 2>&1 || { tail -n 70 "$RUNNER_TEMP/deliverables/checks/$paper-tex.log"; exit 1; }
            cp "$RUNNER_TEMP/paper/$paper.pdf" .
          done
          for paper in arithmetic_cat_map_moments pell_floquet_normal_form; do
            if grep -q 'Overfull \\hbox' "$RUNNER_TEMP/paper/$paper.log"; then
              echo "Horizontal overflow in $paper; refusing publication"; exit 1
            fi
          done
      - name: Final structural audit and publication with an unchanged-head guard
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          python computations/verification/repository_audit.py
          if [ "$PUBLISH" != true ]; then exit 0; fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'main moved; refusing to overwrite concurrent work'; exit 1
          fi
          git config user.name 'WoW research validation'
          git config user.email 'research-validation@users.noreply.github.com'
          git add -A README.md CMakeLists.txt computations formalization/Bgs.lean mathematics record manuscript evidence assets
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish fully checked Floquet proof, corrected anchors, certificates and articles'
            git push origin HEAD:main
            gh workflow run ci.yml --ref main
            gh workflow run pell-validation.yml --ref main -f publish=false
          fi
      - name: Package the actual committed source and verification products
        if: success()
        run: |
          out="$RUNNER_TEMP/deliverables"
          git rev-parse HEAD > "$out/COMMIT.txt"
          git archive --format=zip HEAD > "$out/WoW-reviewed-main.zip"
          cp manuscript/pell_floquet_normal_form.pdf manuscript/arithmetic_cat_map_moments.pdf "$out/"
          cp evidence/certificates/pell_floquet_audit.json evidence/certificates/pell_gamma_interval.json evidence/certificates/floquet_workspace_execution.json "$out/"
          cp assets/figures/pell_floquet_echo.png assets/figures/pell_floquet_commutators.png "$out/"
          cd "$out"
          sha256sum WoW-reviewed-main.zip *.pdf *.json *.png > SHA256SUMS
      - name: Retain source provenance even after a failed validation
        if: always()
        run: |
          out="$RUNNER_TEMP/deliverables"
          mkdir -p "$out"
          git diff --stat > "$out/worktree-diff-stat.txt"
          python - <<'PYFILES'
          import os, subprocess
          from pathlib import Path
          paths=subprocess.check_output(['git','ls-files','-co','--exclude-standard','-z']).split(b'\0')
          paths=sorted({p for p in paths if p and os.path.isfile(p)})
          destination=Path(os.environ['RUNNER_TEMP'])/'deliverables/source-files.txt'
          destination.write_bytes(b'\0'.join(paths)+b'\0')
          PYFILES
          tar --null -T "$out/source-files.txt" -czf "$out/working-source.tar.gz"
          rm "$out/source-files.txt"
          cp evidence/certificates/floquet_workspace_execution.json "$out/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-research-${{ github.run_id }}
          path: ${{ runner.temp }}/deliverables/
          retention-days: 14
