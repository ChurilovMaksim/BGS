name: Pell Gaussian research validation and publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pell-validation.yml'
      - 'computations/verification/pell_gaussian_regression.py'
      - 'computations/maintenance/publish_pell_research.py'
      - 'mathematics/pell_phase_rate.md'
      - 'manuscript/pell_gaussian_section.tex'
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: true
        description: Publish regenerated evidence and documentation
permissions:
  contents: write
  actions: write
concurrency:
  group: pell-research-publication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: python -m pip install -r requirements.txt matplotlib==3.10.5
      - name: Apply reviewed idempotent source corrections
        run: python computations/maintenance/publish_pell_research.py
      - name: Reproduce numerical evidence after the CDF correction
        env:
          OPENBLAS_NUM_THREADS: '1'
          MPLBACKEND: Agg
        run: |
          python computations/verification/pell_gaussian_regression.py --output evidence/numerical/pell_gaussian_blocks.json --figure assets/figures/pell_fourth_moment.png
          python computations/analysis/spectral_diagnostics.py spacing > evidence/numerical/goe_spacing.json
          python computations/verification/repository_audit.py
      - name: Compile maintained C++ and compare independent word representations
        run: |
          cmake -S . -B "$RUNNER_TEMP/wow-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/wow-build" -j2
          python computations/verification/magnetic_quotient_regression.py --cpp "$RUNNER_TEMP/wow-build/magnetic_word_verifier"
          for t in fourth_moment_pair_key_verifier cayley_energy_verifier cayley_fibonacci_verifier cayley_direct_energy_verifier cayley_trace_intercept_rigidity; do "$RUNNER_TEMP/wow-build/$t"; done
          "$RUNNER_TEMP/wow-build/cat_map_order" verify
      - name: Run every maintained Python verifier with source hashes
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess, sys, time
          from concurrent.futures import ThreadPoolExecutor
          root=Path.cwd(); logs=Path(os.environ['RUNNER_TEMP'])/'verification-logs'; logs.mkdir(exist_ok=True)
          paths=sorted(p for p in (root/'computations/verification').glob('*.py') if '__main__' in p.read_text())
          def check(p):
              start=time.monotonic()
              with (logs/(p.stem+'.log')).open('w') as output:
                  try:
                      code=subprocess.run([sys.executable,str(p)],stdout=output,stderr=subprocess.STDOUT,timeout=300).returncode
                  except subprocess.TimeoutExpired:
                      code=124
              row={'source':str(p.relative_to(root)),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'exit_code':code,'seconds':round(time.monotonic()-start,3)}
              print(row,flush=True); return row
          with ThreadPoolExecutor(max_workers=2) as pool: rows=list(pool.map(check,paths))
          report={'producer':'.github/workflows/pell-validation.yml','scope':'Execution checks only, not a complete proof audit; hashes identify the corrected worktree actually executed.','input_commit':os.environ['GITHUB_SHA'],'python':sys.version,'checks':rows}
          Path('record/pell_workspace_execution.json').write_text(json.dumps(report,indent=2)+'\n')
          if any(r['exit_code'] for r in rows): raise SystemExit('At least one verifier failed; see artifact logs.')
          PY
      - name: Compile the finite Lean certificates
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd formalization
          lake build
      - name: Build the synchronized paper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- manuscript/pell_gaussian_section.tex)"
          export FORCE_SOURCE_DATE=1
          cd manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error arithmetic_cat_map_moments.tex
          if grep -q 'Overfull \\hbox' arithmetic_cat_map_moments.log; then
            echo 'PDF has a horizontal overflow; refuse to publish.'; exit 1
          fi
      - name: Publish without rewriting or racing main
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git ls-remote origin refs/heads/main | cut -f1)" ]; then
            echo 'main moved; retain artifacts and do not overwrite concurrent work.'
            exit 0
          fi
          git config user.name 'WoW research validation'
          git config user.email 'research-validation@users.noreply.github.com'
          git add README.md record/claim_ledger.md record/retractions.md mathematics/results.md mathematics/cayley_direct_energy.md mathematics/pell_cat_map_gaussian_blocks.md computations/analysis/spectral_diagnostics.py computations/verification/repository_audit.py computations/cpp/magnetic_word_verifier.cpp manuscript/arithmetic_cat_map_moments.tex manuscript/arithmetic_cat_map_moments.pdf evidence/numerical/pell_gaussian_blocks.json evidence/numerical/goe_spacing.json record/pell_workspace_execution.json assets/figures/pell_fourth_moment.png
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish validated Pell evidence, corrected audit, and synchronized paper'
            git push origin HEAD:main
            # Token pushes do not trigger push workflows; validate committed HEAD
            # explicitly, without a second publication loop.
            gh workflow run pell-validation.yml --ref main -f publish=false
          fi
      - name: Package tracked source
        if: success()
        run: git archive --format=zip HEAD > "$RUNNER_TEMP/WoW-research.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pell-research-${{ github.sha }}
          path: |
            evidence/numerical/pell_gaussian_blocks.json
            record/pell_workspace_execution.json
            assets/figures/pell_fourth_moment.png
            manuscript/arithmetic_cat_map_moments.pdf
            ${{ runner.temp }}/verification-logs/
            ${{ runner.temp }}/WoW-research.zip
          retention-days: 30
