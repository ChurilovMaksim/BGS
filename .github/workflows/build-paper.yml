name: Build canonical paper

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'repair/**'
    paths:
      - paper/main.tex
  workflow_dispatch:

concurrency:
  group: build-canonical-paper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix reproducible build timestamp
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct -- paper/main.tex)"
          echo "SOURCE_DATE_EPOCH=${epoch}" >> "$GITHUB_ENV"
          echo "FORCE_SOURCE_DATE=1" >> "$GITHUB_ENV"

      - name: Compile canonical manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Verify canonical PDF
        shell: bash
        run: |
          set -euo pipefail
          test -s paper/main.pdf
          ls -lh paper/main.tex paper/main.pdf

      - name: Commit synchronized PDF when branch head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/main.pdf
          if git diff --cached --quiet; then
            echo "paper/main.pdf is already synchronized"
            exit 0
          fi

          git fetch origin "${GITHUB_REF_NAME}"
          remote_head="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          if [ "${remote_head}" != "${GITHUB_SHA}" ]; then
            echo "Branch advanced from ${GITHUB_SHA} to ${remote_head}; compiled PDF verified, skip stale bot push."
            exit 0
          fi

          git commit -m "paper: rebuild canonical PDF [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
