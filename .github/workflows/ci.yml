name: Scientific verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  computation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile active Python
        run: |
          python -m compileall -q computations/python
          python -m compileall -q computations/verification
      - name: Check active implementation language boundary
        shell: bash
        run: |
          if find computations mathematics formalization manuscript evidence -name '*.jl' -print -quit | grep -q .; then
            echo 'Julia source leaked into the active research surface'
            exit 1
          fi
      - name: Parse promoted JSON evidence and resolve producers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('evidence').rglob('*.json'):
              data=json.loads(path.read_text(encoding='utf-8'))
              producer=data.get('producer')
              if producer:
                  direct=Path(producer); historical=Path('record/corpus')/producer
                  if not direct.exists() and not historical.exists():
                      raise SystemExit(f'{path}: unresolved producer {producer}')
              for old_path in data.get('reference_inputs', {}):
                  p=Path(old_path); candidates=[p,Path('record/corpus')/p]
                  if p.parts and p.parts[0]=='results': candidates.append(Path('evidence').joinpath(*p.parts[1:]))
                  if not any(x.exists() for x in candidates):
                      raise SystemExit(f'{path}: unresolved reference input {old_path}')
          print('evidence provenance: OK')
          PY
      - name: Run current exact finite regression
        run: python computations/verification/current_regression.py
      - name: Recompute fixed-K Cayley exceptional-prime certificate
        run: |
          python computations/verification/mixed_cayley_energy.py > /tmp/mixed_cayley_energy.json
          python - <<'PY'
          import json
          from pathlib import Path
          fresh=json.loads(Path('/tmp/mixed_cayley_energy.json').read_text())
          committed=json.loads(Path('evidence/certificates/second_moment_reduction.json').read_text())
          if fresh != committed: raise SystemExit('second_moment_reduction.json is not synchronized with its exact producer')
          print('fixed-K Cayley certificate: synchronized')
          PY
      - name: Build active C++ verifiers
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
      - name: Run C++ regression gates
        run: |
          ./build/fourth_moment_pair_key_verifier
          ./build/cat_map_order verify

  formalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Lean module coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          modules={f'Bgs.{p.stem}' for p in Path('formalization/Bgs').glob('*.lean')}
          imported=set()
          for line in Path('formalization/Bgs.lean').read_text(encoding='utf-8').splitlines():
              line=line.strip()
              if line.startswith('import '): imported.add(line.removeprefix('import ').strip())
          missing=sorted(modules-imported); extra=sorted(imported-modules)
          if missing: raise SystemExit('unimported active Lean modules: '+', '.join(missing))
          if extra: raise SystemExit('imports without active module files: '+', '.join(extra))
          print(f'Lean module coverage: {len(modules)}/{len(modules)}')
          PY
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build every active Lean module
        run: |
          cd formalization
          lake build

  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check committed PDF
        run: test -s manuscript/arithmetic_cat_map_moments.pdf
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Compile manuscript independently
        run: |
          mkdir -p build/manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build/manuscript manuscript/arithmetic_cat_map_moments.tex
          test -s build/manuscript/arithmetic_cat_map_moments.pdf
