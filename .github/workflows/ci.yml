name: Scientific verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Audit claim registry, dependencies, papers, and governance
        run: |
          python computations/verification/scientific_registry_audit.py
          python computations/verification/bibliographic_metadata_audit.py --self-test
          python computations/maintenance/render_claim_registry.py --check
          python computations/maintenance/render_errata.py --check

  repository-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Audit canonical repository structure
        run: python computations/verification/repository_audit.py

  computation:
    needs: [scientific-registry, repository-structure]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies and build all C++ verifiers
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y libboost-dev
          cmake -S . -B "$RUNNER_TEMP/bgs-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/bgs-build" -j2
      - name: Compile and execute every maintained Python and C++ verifier
        run: |
          python -W error::SyntaxWarning -m compileall -q computations
          python -m unittest discover -s computations/maintenance/tests -v
          python computations/maintenance/verify_workspace.py --build "$RUNNER_TEMP/bgs-build" --logs "$RUNNER_TEMP/checks" --output "$RUNNER_TEMP/workspace.json"
          python computations/maintenance/verify_fixed_map_supplement.py --output-dir "$RUNNER_TEMP/fixed-map-replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-computation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/checks/
            ${{ runner.temp }}/workspace.json
            ${{ runner.temp }}/fixed-map-replay/verification.json

  formalization:
    needs: [scientific-registry, repository-structure]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Lean and compile all active finite formal certificates
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd formalization
          lake build

  manuscript:
    needs: [scientific-registry, repository-structure]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra lmodern pandoc
      - name: Build canonical unified manuscript
        run: |
          python computations/maintenance/sync_return_sections.py --check
          python computations/maintenance/sync_finite_orbit_section.py --check
          python computations/maintenance/sync_fixed_map_section.py --check
          python computations/maintenance/build_unified_manuscript.py --output-dir "$RUNNER_TEMP/unified-paper"
          test -s "$RUNNER_TEMP/unified-paper/BGS_unified.pdf"
