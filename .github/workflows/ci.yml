name: Scientific verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Audit claim registry, dependencies, papers, and governance
        run: |
          python computations/verification/scientific_registry_audit.py
          python computations/verification/bibliographic_metadata_audit.py --self-test
          python computations/maintenance/render_claim_registry.py --check
          python computations/maintenance/render_errata.py --check

  repository-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Audit canonical repository structure
        run: python computations/verification/repository_audit.py

  computation:
    needs: [scientific-registry, repository-structure]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies and build all C++ verifiers
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y libboost-dev
          cmake -S . -B "$RUNNER_TEMP/bgs-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/bgs-build" -j2
      - name: Compile and execute every maintained Python and C++ verifier
        run: |
          python -W error::SyntaxWarning -m compileall -q computations
          python -m unittest discover -s computations/maintenance/tests -v
          python computations/maintenance/verify_workspace.py --build "$RUNNER_TEMP/bgs-build" --logs "$RUNNER_TEMP/checks" --output "$RUNNER_TEMP/workspace.json"
          python computations/maintenance/verify_fixed_map_supplement.py --output-dir "$RUNNER_TEMP/fixed-map-replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-computation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/checks/
            ${{ runner.temp }}/workspace.json
            ${{ runner.temp }}/fixed-map-replay/verification.json

  formalization:
    needs: [scientific-registry, repository-structure]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Lean and compile all active finite formal certificates
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd formalization
          lake build

  manuscript:
    needs: [scientific-registry, repository-structure]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra lmodern pandoc
      - name: Build canonical unified manuscript
        run: |
          python computations/maintenance/sync_return_sections.py --check
          python computations/maintenance/sync_finite_orbit_section.py --check
          python computations/maintenance/sync_fixed_map_section.py --check
          python computations/maintenance/audit_manuscript_references.py --check
          python computations/maintenance/build_unified_manuscript.py --output-dir "$RUNNER_TEMP/unified-paper"
          test -s "$RUNNER_TEMP/unified-paper/BGS_unified.pdf"

  wave2-portable:
    name: "Wave2 portable (${{ matrix.openblas_coretype }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        openblas_coretype: [HASWELL, ZEN3]
    env:
      OPENBLAS_CORETYPE: ${{ matrix.openblas_coretype }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned scientific libraries
        run: python -m pip install -r requirements.txt
      - name: Assert intact historical seals and adversarial v2 rules
        run: |
          python computations/verification/wave2_checked_replay.py --check-sources
          python computations/verification/wave3_checked_replay.py --check-sources
          python -m unittest discover -s computations/maintenance/tests -p test_wave2_portable_replay.py -v
      - name: Execute all eight original authenticated Wave2 tasks with portable criteria
        run: |
          python computations/verification/wave2_portable_replay.py --output-dir "$RUNNER_TEMP/wave2-portable"
          python -c "import json,os; from pathlib import Path; d=json.loads((Path(os.environ['RUNNER_TEMP'])/'wave2-portable'/'replay_manifest.json').read_text()); assert d['schema']=='bgs-wave2-portable-replay-v2' and d['status']=='passed' and len(d['tasks'])==8"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "wave2-portable-${{ matrix.openblas_coretype }}-${{ github.run_id }}"
          path: ${{ runner.temp }}/wave2-portable/
          if-no-files-found: warn
