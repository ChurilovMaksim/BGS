name: Scientific verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  computation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: |
          python -m compileall -q src/python
          python -m compileall -q experiments/verification
          python -m compileall -q experiments/spectral
      - name: Parse retained JSON results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("results").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("JSON corpus: OK")
          PY
      - name: Run exact Python gates
        run: |
          python experiments/verification/verify_cayley_anchor_k23.py
          python experiments/verification/verify_second_moment_reduction.py
      - name: Install C++ dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
      - name: Build C++ exact verifiers
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
      - name: Run C++ regression gates
        run: |
          ./build/cross_term_energy verify
          ./build/fourth_moment_factorization

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean certificates
        run: |
          cd formal
          lake build

  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Compile manuscript
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
