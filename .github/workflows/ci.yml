name: Scientific verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  computation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile active Python
        run: |
          python -m compileall -q computations/python
          python -m compileall -q computations/verification
      - name: Parse promoted JSON evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("evidence").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("evidence JSON: OK")
          PY
      - name: Run current exact finite regression
        run: python computations/verification/current_regression.py
      - name: Install C++ dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
      - name: Build supported C++ kernels
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
      - name: Run C++ regression gates
        run: |
          ./build/cross_term_energy verify
          ./build/fourth_moment_factorization
          ./build/catmap_order verify
          ./build/relation_automaton verify

  formalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean sources
        run: |
          cd formalization
          lake build

  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check committed PDF
        run: test -s manuscript/arithmetic_cat_map_moments.pdf
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Compile manuscript independently
        run: |
          mkdir -p build/manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error \
            -outdir=build/manuscript \
            manuscript/arithmetic_cat_map_moments.tex
          test -s build/manuscript/arithmetic_cat_map_moments.pdf
