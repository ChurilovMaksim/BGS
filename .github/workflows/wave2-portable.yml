name: Portable Wave2 Schur-basis verification
on:
  pull_request:
    paths:
      - 'computations/verification/wave2_portable_replay.py'
      - 'computations/maintenance/verify_workspace.py'
      - 'computations/maintenance/tests/test_wave2_portable_replay.py'
      - 'mathematics/wave2_schur_basis_portability.md'
      - '.github/workflows/wave2-portable.yml'
  push:
    branches: [main]
    paths:
      - 'computations/verification/wave2_portable_replay.py'
      - 'computations/maintenance/verify_workspace.py'
      - 'computations/maintenance/tests/test_wave2_portable_replay.py'
      - 'mathematics/wave2_schur_basis_portability.md'
      - '.github/workflows/wave2-portable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wave2-portable:
    name: "Wave2 portable (${{ matrix.openblas_coretype }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        openblas_coretype: [HASWELL, ZEN3]
    env:
      OPENBLAS_CORETYPE: ${{ matrix.openblas_coretype }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned scientific libraries
        run: python -m pip install -r requirements.txt
      - name: Assert intact historical seals and adversarial v2 rules
        run: |
          python computations/verification/wave2_checked_replay.py --check-sources
          python computations/verification/wave3_checked_replay.py --check-sources
          python -m unittest discover -s computations/maintenance/tests -p test_wave2_portable_replay.py -v
      - name: Execute all eight original authenticated Wave2 tasks with portable criteria
        run: |
          python computations/verification/wave2_portable_replay.py --output-dir "$RUNNER_TEMP/wave2-portable"
          python -c "import json,os; from pathlib import Path; d=json.loads((Path(os.environ['RUNNER_TEMP'])/'wave2-portable'/'replay_manifest.json').read_text()); assert d['schema']=='bgs-wave2-portable-replay-v2' and d['status']=='passed' and len(d['tasks'])==8"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "wave2-portable-${{ matrix.openblas_coretype }}-${{ github.run_id }}"
          path: ${{ runner.temp }}/wave2-portable/
          if-no-files-found: warn
