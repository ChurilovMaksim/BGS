name: Independent manuscript build
on:
  push:
    branches: [main]
    paths:
      - 'manuscript/**'
      - 'mathematics/**'
      - 'computations/maintenance/sync_return_sections.py'
      - 'computations/maintenance/sync_fixed_map_section.py'
      - 'computations/maintenance/build_unified_manuscript.py'
      - '.github/workflows/build-manuscript.yml'
  pull_request:
    paths:
      - 'manuscript/**'
      - 'mathematics/**'
      - 'computations/maintenance/sync_return_sections.py'
      - 'computations/maintenance/sync_fixed_map_section.py'
      - 'computations/maintenance/build_unified_manuscript.py'
      - '.github/workflows/build-manuscript.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra lmodern pandoc
      - name: Build canonical unified manuscript
        run: |
          python computations/maintenance/sync_return_sections.py --check
          python computations/maintenance/sync_fixed_map_section.py --check
          python computations/maintenance/build_unified_manuscript.py --output-dir "$RUNNER_TEMP/unified-paper"
          test -s "$RUNNER_TEMP/unified-paper/WoW_unified.pdf"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-manuscript-${{ github.run_id }}
          path: ${{ runner.temp }}/unified-paper/
