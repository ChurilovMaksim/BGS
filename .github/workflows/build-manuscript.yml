name: Independent manuscript build

on:
  push:
    branches: [main]
    paths: ['manuscript/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Compile committed sources without publishing or repairing them
        run: |
          mkdir -p "$RUNNER_TEMP/paper"
          cd manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir="$RUNNER_TEMP/paper" arithmetic_cat_map_moments.tex
          test -s "$RUNNER_TEMP/paper/arithmetic_cat_map_moments.pdf"
