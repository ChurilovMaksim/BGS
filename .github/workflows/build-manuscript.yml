name: Independent manuscript build
on:
  push:
    branches: [main]
    paths:
      - 'manuscript/**'
      - 'mathematics/**'
      - 'papers/**'
      - 'record/claims.json'
      - 'record/generated_sources.json'
      - 'record/mathematics_topics.json'
      - 'literature/metadata_audit.json'
      - 'archive/evidence/source_metadata/registry_metadata_20261020.*'
      - 'computations/maintenance/render_research_views.py'
      - 'computations/verification/bibliographic_metadata_audit.py'
      - 'literature/external_dependencies.json'
      - 'computations/verification/scientific_registry_audit.py'
      - 'computations/maintenance/sync_return_sections.py'
      - 'computations/maintenance/sync_finite_orbit_section.py'
      - 'computations/maintenance/sync_fixed_map_section.py'
      - 'computations/maintenance/audit_manuscript_references.py'
      - 'computations/maintenance/build_unified_manuscript.py'
      - '.github/workflows/build-manuscript.yml'
  pull_request:
    paths:
      - 'manuscript/**'
      - 'mathematics/**'
      - 'papers/**'
      - 'record/claims.json'
      - 'record/generated_sources.json'
      - 'record/mathematics_topics.json'
      - 'literature/metadata_audit.json'
      - 'archive/evidence/source_metadata/registry_metadata_20261020.*'
      - 'computations/maintenance/render_research_views.py'
      - 'computations/verification/bibliographic_metadata_audit.py'
      - 'literature/external_dependencies.json'
      - 'computations/verification/scientific_registry_audit.py'
      - 'computations/maintenance/sync_return_sections.py'
      - 'computations/maintenance/sync_finite_orbit_section.py'
      - 'computations/maintenance/sync_fixed_map_section.py'
      - 'computations/maintenance/audit_manuscript_references.py'
      - 'computations/maintenance/build_unified_manuscript.py'
      - '.github/workflows/build-manuscript.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate scientific metadata
        run: |
          python computations/verification/scientific_registry_audit.py
          python computations/verification/bibliographic_metadata_audit.py --self-test
          python computations/maintenance/render_claim_registry.py --check
          python computations/maintenance/render_errata.py --check
          python computations/maintenance/render_research_views.py --check
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra lmodern pandoc
      - name: Build canonical unified manuscript
        run: |
          python computations/maintenance/sync_return_sections.py --check
          python computations/maintenance/sync_finite_orbit_section.py --check
          python computations/maintenance/sync_fixed_map_section.py --check
          python computations/maintenance/audit_manuscript_references.py --check
          python computations/maintenance/build_unified_manuscript.py --output-dir "$RUNNER_TEMP/unified-paper"
          test -s "$RUNNER_TEMP/unified-paper/BGS_unified.pdf"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-manuscript-${{ github.run_id }}
          path: ${{ runner.temp }}/unified-paper/
