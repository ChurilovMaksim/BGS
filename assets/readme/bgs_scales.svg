<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
<rect width="1600" height="560" fill="#ffffff"/>
<rect x="1" y="1" width="1598" height="558" fill="none" stroke="#d0d7de" stroke-width="2"/>
<text x="70" y="68" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#172b4d">Why Heisenberg time is unavoidable</text>
<text x="70" y="102" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#57606a">Microscopic Fourier tests force trace information up to powers m proportional to N</text>

<line x1="120" y1="300" x2="1480" y2="300" stroke="#24292f" stroke-width="3"/>
<g font-family="Arial,Helvetica,sans-serif">
  <line x1="230" y1="286" x2="230" y2="314" stroke="#24292f" stroke-width="2"/>
  <text x="230" y="342" text-anchor="middle" font-size="16" fill="#24292f">m = O(1)</text>
  <text x="230" y="370" text-anchor="middle" font-size="14" fill="#57606a">fixed-time control</text>

  <line x1="515" y1="286" x2="515" y2="314" stroke="#24292f" stroke-width="2"/>
  <text x="515" y="342" text-anchor="middle" font-size="16" fill="#24292f">m ~ log N</text>
  <text x="515" y="370" text-anchor="middle" font-size="14" fill="#57606a">return / Ehrenfest-type regimes</text>

  <line x1="855" y1="286" x2="855" y2="314" stroke="#24292f" stroke-width="2"/>
  <text x="855" y="342" text-anchor="middle" font-size="16" fill="#24292f">m = o(N)</text>
  <text x="855" y="370" text-anchor="middle" font-size="14" fill="#57606a">still below microscopic closure</text>

  <line x1="1285" y1="280" x2="1285" y2="320" stroke="#cf222e" stroke-width="4"/>
  <text x="1285" y="342" text-anchor="middle" font-size="17" font-weight="700" fill="#cf222e">m = Θ(N)</text>
  <text x="1285" y="370" text-anchor="middle" font-size="14" fill="#cf222e">Heisenberg scale</text>
</g>

<rect x="1040" y="160" width="430" height="78" rx="8" fill="#ffebe9" stroke="#cf222e"/>
<text x="1066" y="191" font-family="Arial" font-size="17" font-weight="700" fill="#82071e">Microscopic pair test</text>
<text x="1066" y="219" font-family="Arial" font-size="15" fill="#82071e">Fourier mode m enters as ˆφ(m/N)</text>
<path d="M1255 238 C1268 254 1279 267 1285 286" fill="none" stroke="#cf222e" stroke-width="2"/>

<rect x="90" y="158" width="790" height="82" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
<text x="116" y="189" font-family="Arial" font-size="17" font-weight="700" fill="#0550ae">What partial results can already control</text>
<text x="116" y="217" font-family="Arial" font-size="15" fill="#0550ae">fixed moments · logarithmic returns · global laws · perturbative crossovers · selected finite windows</text>

<rect x="90" y="428" width="1380" height="72" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
<text x="116" y="457" font-family="Arial" font-size="16" font-weight="700" fill="#24292f">Exact bridge:</text>
<text x="222" y="457" font-family="Arial" font-size="16" fill="#24292f">compact microscopic Fourier support does not truncate time at o(N); it rescales the mode index by N.</text>
<text x="116" y="483" font-family="Arial" font-size="15" fill="#57606a">Therefore a genuine BGS proof must either control joint traces at m = Θ(N) or prove an analytically equivalent mixed-resolvent hierarchy.</text>
</svg>