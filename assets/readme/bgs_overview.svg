<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<rect width="1600" height="720" fill="#ffffff"/>
<rect x="1" y="1" width="1598" height="718" fill="none" stroke="#d0d7de" stroke-width="2"/>
<text x="70" y="72" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#172b4d">The BGS question in one figure</text>
<text x="70" y="108" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#57606a">From deterministic chaotic dynamics to universal local spectral statistics</text>

<g transform="translate(70,160)">
  <rect width="420" height="430" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="28" y="42" font-family="Arial" font-size="22" font-weight="700" fill="#24292f">1. Classical dynamics</text>
  <text x="28" y="72" font-family="Arial" font-size="16" fill="#57606a">hyperbolic / chaotic map on phase space</text>
  <g transform="translate(58,118)">
    <rect width="300" height="220" fill="#ffffff" stroke="#afb8c1"/>
    <g stroke="#d8dee4" stroke-width="1"><path d="M0 55 H300 M0 110 H300 M0 165 H300"/><path d="M75 0 V220 M150 0 V220 M225 0 V220"/></g>
    <path d="M16 188 C66 160 64 65 118 48 C174 30 194 192 252 170 C276 161 283 105 292 42" fill="none" stroke="#0969da" stroke-width="4"/>
    <path d="M20 47 C76 60 92 174 145 182 C194 190 215 79 285 82" fill="none" stroke="#1f883d" stroke-width="3"/>
  </g>
  <text x="28" y="378" font-family="Arial" font-size="15" fill="#57606a">Question: how does classical chaos constrain</text>
  <text x="28" y="402" font-family="Arial" font-size="15" fill="#57606a">the quantum spectrum after quantization?</text>
</g>

<path d="M510 375 H575" stroke="#8c959f" stroke-width="3"/>
<path d="M575 375 l-13 -8 v16 z" fill="#8c959f"/>

<g transform="translate(590,160)">
  <rect width="420" height="430" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="28" y="42" font-family="Arial" font-size="22" font-weight="700" fill="#24292f">2. Quantum spectrum</text>
  <text x="28" y="72" font-family="Arial" font-size="16" fill="#57606a">eigenphases of an N-dimensional propagator</text>
  <g transform="translate(74,118)">
    <circle cx="135" cy="110" r="102" fill="#fff" stroke="#afb8c1" stroke-width="2"/>
    <g stroke="#0969da" stroke-width="3">
      <path d="M135 8 v-18"/><path d="M192 26 l10 -15"/><path d="M229 70 l17 -7"/><path d="M237 126 l18 3"/>
      <path d="M210 174 l13 14"/><path d="M151 210 l3 18"/><path d="M92 201 l-8 17"/><path d="M48 160 l-16 10"/>
      <path d="M34 102 l-18 -1"/><path d="M56 52 l-14 -12"/><path d="M102 19 l-5 -17"/>
    </g>
    <text x="282" y="64" font-family="Arial" font-size="16" fill="#24292f">mean spacing</text>
    <text x="282" y="89" font-family="Arial" font-size="19" font-weight="700" fill="#0969da">~ 1 / N</text>
    <path d="M237 126 C267 126 276 101 282 91" fill="none" stroke="#57606a" stroke-width="1.5"/>
  </g>
  <text x="28" y="378" font-family="Arial" font-size="15" fill="#57606a">Unfold, remove symmetries, then zoom to the</text>
  <text x="28" y="402" font-family="Arial" font-size="15" fill="#57606a">mean-level-spacing scale.</text>
</g>

<path d="M1030 375 H1095" stroke="#8c959f" stroke-width="3"/>
<path d="M1095 375 l-13 -8 v16 z" fill="#8c959f"/>

<g transform="translate(1110,160)">
  <rect width="420" height="430" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="28" y="42" font-family="Arial" font-size="22" font-weight="700" fill="#24292f">3. BGS universality</text>
  <text x="28" y="72" font-family="Arial" font-size="16" fill="#57606a">local statistics match the symmetry-class RMT law</text>
  <g transform="translate(48,122)">
    <path d="M0 220 H315" stroke="#afb8c1" stroke-width="1.5"/>
    <path d="M0 0 V220" stroke="#afb8c1" stroke-width="1.5"/>
    <path d="M8 218 C35 214 47 184 66 157 C88 126 114 121 138 101 C164 80 192 51 224 62 C265 76 289 126 310 161" fill="none" stroke="#cf222e" stroke-width="4"/>
    <text x="14" y="24" font-family="Arial" font-size="14" fill="#57606a">pair / k-point correlation</text>
    <text x="224" y="205" font-family="Arial" font-size="14" fill="#57606a">microscopic scale</text>
  </g>
  <text x="28" y="378" font-family="Arial" font-size="15" fill="#57606a">The ensemble is not chosen by aesthetics:</text>
  <text x="28" y="402" font-family="Arial" font-size="15" fill="#57606a">it is fixed by the actual symmetry class.</text>
</g>

<rect x="70" y="624" width="1460" height="54" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
<text x="92" y="657" font-family="Arial" font-size="17" font-weight="700" fill="#633c01">Core difficulty:</text>
<text x="218" y="657" font-family="Arial" font-size="17" fill="#633c01">classical chaos is macroscopic; BGS asks for quantum correlations at scale 1/N and therefore forces control out to Heisenberg time.</text>
</svg>