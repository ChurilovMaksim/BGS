    <text x="24" y="91" font-size="15" fill="#24292f">microscopic Fourier representation</text>
    <text x="24" y="119" font-size="14" fill="#57606a">BGS-TRACE-001–004</text>
  </g>

  <g transform="translate(70,565)">
