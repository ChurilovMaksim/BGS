<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="435" viewBox="0 0 1170 435" role="img" aria-labelledby="title desc">
<title id="title">BGS scientific record: sources, dependencies, checks and publication</title>
<desc id="desc">A status ledger governs the reading of canonical proofs. External theorem dependencies and finite verification add specific support, while the living manuscript and candidate papers summarize claims without strengthening them. Historical evidence stays immutable.</desc>
